[project]
name = "modkit-mcp"
version = "0.1.0"
description = "MCP server for agent-driven Android game modding over adb (Waydroid or a phone): logs, screen, input, app lifecycle and an in-game bridge."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "pillow>=10"]

[project.scripts]
modkit-mcp = "modkit_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modkit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
